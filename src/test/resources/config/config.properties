# EaseMyTrip Framework Configuration Properties

# Application URL
url=https://www.easemytrip.com/

# Browser Options: chrome, firefox, edge
browser=chrome

# Execution Mode: true for headless, false for normal browser window
headless=false

# Timeouts in seconds
implicit.wait=0
explicit.wait=15
page.load.timeout=30

# Screenshot capture
screenshot.on.failure=true
screenshot.on.success=false

# Extent Report Settings
extent.report.title=EaseMyTrip Automation Execution Report
extent.report.name=EaseMyTrip Web Test Automation
extent.report.theme=STANDARD
